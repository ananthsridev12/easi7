title: 'Service Page (Layout B)'

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        content:
          type: tab
          title: Content
          fields:
            title:
              type: text
              label: Title
              validate:
                required: true
            eyebrow:
              type: text
              label: Eyebrow
            headline:
              type: text
              label: Headline
            summary:
              type: textarea
              label: Summary
              rows: 3
            primary_intent:
              type: text
              label: Primary Search Intent
            entities:
              type: array
              label: Entities
            tools:
              type: array
              label: Tools
            service_url:
              type: text
              label: Canonical Service URL
            overview:
              type: editor
              label: Overview
            overview_answer:
              type: textarea
              label: 'Overview (short answer)'
              rows: 2
            capabilities:
              type: list
              label: Capabilities
              style: vertical
              collapsed: true
              fields:
                .title:
                  type: text
                  label: Title
                .items:
                  type: array
                  label: Items
            included:
              type: list
              label: Included
              style: vertical
              collapsed: true
              fields:
                .a:
                  type: text
                  label: Item
                .b:
                  type: text
                  label: Description
            how_we_work:
              type: list
              label: 'How We Work'
              style: vertical
              collapsed: true
              fields:
                .title:
                  type: text
                  label: Step Title
                .body:
                  type: textarea
                  label: Step Body
                  rows: 2
            use_cases:
              type: array
              label: Use Cases
            who_needs_this:
              type: list
              label: 'Who Needs This'
              style: vertical
              collapsed: true
              fields:
                .title:
                  type: text
                  label: Title
                .body:
                  type: textarea
                  label: Body
                  rows: 2
            benefits:
              type: array
              label: Benefits
            why_choose_us:
              type: array
              label: 'Why Choose Us'
            comparison.headers:
              type: array
              label: 'Comparison: Column Headers (2)'
            comparison.rows:
              type: list
              label: 'Comparison: Rows'
              style: vertical
              collapsed: true
              fields:
                .a:
                  type: text
                  label: 'Column A'
                .b:
                  type: text
                  label: 'Column B'
            comparison.note:
              type: textarea
              label: 'Comparison: Note'
              rows: 2
            faqs:
              type: list
              label: FAQs
              style: vertical
              collapsed: true
              fields:
                .q:
                  type: text
                  label: Question
                .a:
                  type: textarea
                  label: Answer
                  rows: 3
            cta.heading:
              type: text
              label: 'CTA: Heading'
            cta.body:
              type: textarea
              label: 'CTA: Body'
              rows: 2
            cta.button_label:
              type: text
              label: 'CTA: Button Label'
            cta.button_url:
              type: text
              label: 'CTA: Button URL'

        seo:
          type: tab
          title: 'SEO & Taxonomy'
          fields:
            taxonomy.service:
              type: array
              label: 'Taxonomy: Service'
            'metadata.description':
              type: textarea
              label: 'Meta Description'
              rows: 2
            sitemap.changefreq:
              type: select
              label: 'Sitemap: Change Frequency'
              options:
                always: always
                hourly: hourly
                daily: daily
                weekly: weekly
                monthly: monthly
                yearly: yearly
                never: never
            sitemap.priority:
              type: number
              label: 'Sitemap: Priority'
              validate:
                min: 0
                max: 1
                step: 0.1
