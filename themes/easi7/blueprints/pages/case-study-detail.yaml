title: Case Study
extends@:
  type: default
context: blueprints://pages
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          fields:
            client:
              type: text
              label: Client
            industry:
              type: text
              label: Industry
            portfolio_url:
              type: text
              label: Related Portfolio URL
            service_url:
              type: text
              label: Related Service URL
            summary:
              type: textarea
              label: Summary
              rows: 3
            metrics:
              type: list
              label: Metrics
              style: vertical
              collapsed: true
              fields:
                .value:
                  type: text
                  label: Value
                .label:
                  type: text
                  label: Label
            taxonomy.industry:
              type: array
              label: 'Taxonomy: Industry'
            taxonomy.service:
              type: array
              label: 'Taxonomy: Service'
            metadata.description:
              type: textarea
              label: Meta Description
              rows: 2
            sitemap.changefreq:
              type: select
              label: 'Sitemap: Change Frequency'
              options:
                always: always
                hourly: hourly
                daily: daily
                weekly: weekly
                monthly: monthly
                yearly: yearly
                never: never
            sitemap.priority:
              type: number
              label: 'Sitemap: Priority'
              validate:
                min: 0
                max: 1
                step: 0.1
