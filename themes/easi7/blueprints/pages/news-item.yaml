title: 'News Item'

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        content:
          type: tab
          title: Content
          fields:
            title:
              type: text
              label: Title
              validate:
                required: true
            date:
              type: datetime
              label: 'Publish Date'
            author:
              type: text
              label: Author

        seo:
          type: tab
          title: 'SEO & Taxonomy'
          fields:
            taxonomy.category:
              type: array
              label: 'Taxonomy: Category'
            taxonomy.tag:
              type: array
              label: 'Taxonomy: Tags'
            'metadata.description':
              type: textarea
              label: 'Meta Description'
              rows: 2
            sitemap.changefreq:
              type: select
              label: 'Sitemap: Change Frequency'
              options:
                always: always
                hourly: hourly
                daily: daily
                weekly: weekly
                monthly: monthly
                yearly: yearly
                never: never
            sitemap.priority:
              type: number
              label: 'Sitemap: Priority'
              validate:
                min: 0
                max: 1
                step: 0.1
