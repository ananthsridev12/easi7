title: 'Thank You Page'

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        content:
          type: tab
          title: Content
          fields:
            title:
              type: text
              label: Title
              validate:
                required: true
            menu:
              type: text
              label: 'Menu Label (blank/false to hide from nav)'
            summary:
              type: textarea
              label: Summary
              rows: 3

        seo:
          type: tab
          title: SEO
          fields:
            'metadata.description':
              type: textarea
              label: 'Meta Description'
              rows: 2
            sitemap.ignore:
              type: toggle
              label: 'Sitemap: Exclude from Sitemap'
              options:
                1: 'Yes'
                0: 'No'
              validate:
                type: bool
