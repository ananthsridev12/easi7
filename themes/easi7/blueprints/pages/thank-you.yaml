title: Thank You Page
extends@:
  type: default
context: blueprints://pages
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          fields:
            menu:
              type: text
              label: Menu Label (blank/false to hide from nav)
            summary:
              type: textarea
              label: Summary
              rows: 3
            metadata.description:
              type: textarea
              label: Meta Description
              rows: 2
            sitemap.ignore:
              type: toggle
              label: 'Sitemap: Exclude from Sitemap'
              options:
                1: 'Yes'
                0: 'No'
              validate:
                type: bool
