title: 'Portfolio Listing'

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        content:
          type: tab
          title: Content
          fields:
            title:
              type: text
              label: Title
              validate:
                required: true
            menu:
              type: text
              label: 'Menu Label'
            summary:
              type: textarea
              label: Summary
              rows: 3
            cta.heading:
              type: text
              label: 'CTA: Heading'
            cta.body:
              type: textarea
              label: 'CTA: Body'
              rows: 2
            cta.button_label:
              type: text
              label: 'CTA: Button Label'
            cta.button_url:
              type: text
              label: 'CTA: Button URL'

        seo:
          type: tab
          title: SEO
          fields:
            'metadata.description':
              type: textarea
              label: 'Meta Description'
              rows: 2
            sitemap.changefreq:
              type: select
              label: 'Sitemap: Change Frequency'
              options:
                always: always
                hourly: hourly
                daily: daily
                weekly: weekly
                monthly: monthly
                yearly: yearly
                never: never
            sitemap.priority:
              type: number
              label: 'Sitemap: Priority'
              validate:
                min: 0
                max: 1
                step: 0.1
