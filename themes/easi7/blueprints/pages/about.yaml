title: About Page
extends@:
  type: default
context: blueprints://pages
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          fields:
            menu:
              type: text
              label: Menu Label
            summary:
              type: textarea
              label: Summary
              rows: 3
            founder.initials:
              type: text
              label: 'Founder: Initials'
            founder.name:
              type: text
              label: 'Founder: Name'
            founder.role:
              type: text
              label: 'Founder: Role'
            founder.bio:
              type: textarea
              label: 'Founder: Bio'
              rows: 4
            cta.heading:
              type: text
              label: 'CTA: Heading'
            cta.body:
              type: textarea
              label: 'CTA: Body'
              rows: 2
            cta.button_label:
              type: text
              label: 'CTA: Button Label'
            cta.button_url:
              type: text
              label: 'CTA: Button URL'
            metadata.description:
              type: textarea
              label: Meta Description
              rows: 2
            sitemap.changefreq:
              type: select
              label: 'Sitemap: Change Frequency'
              options:
                always: always
                hourly: hourly
                daily: daily
                weekly: weekly
                monthly: monthly
                yearly: yearly
                never: never
            sitemap.priority:
              type: number
              label: 'Sitemap: Priority'
              validate:
                min: 0
                max: 1
                step: 0.1
