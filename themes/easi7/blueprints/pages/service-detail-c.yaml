title: Service Page (Layout C)
extends@:
  type: default
context: blueprints://pages
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          fields:
            eyebrow:
              type: text
              label: Eyebrow
            headline:
              type: text
              label: Headline
            summary:
              type: textarea
              label: Summary
              rows: 3
            primary_intent:
              type: text
              label: Primary Search Intent
            entities:
              type: array
              label: Entities
            tools:
              type: array
              label: Tools
            service_url:
              type: text
              label: Canonical Service URL
            definition:
              type: editor
              label: Definition
            definition_answer:
              type: textarea
              label: Definition (short answer)
              rows: 2
            why_it_matters:
              type: editor
              label: Why It Matters
            diagram:
              type: textarea
              label: Diagram (plain-text schematic)
              rows: 2
            challenges:
              type: array
              label: Challenges
            framework:
              type: list
              label: Framework
              style: vertical
              collapsed: true
              fields:
                .title:
                  type: text
                  label: Title
                .items:
                  type: array
                  label: Items
            deliverables:
              type: list
              label: Deliverables
              style: vertical
              collapsed: true
              fields:
                .a:
                  type: text
                  label: Item
                .b:
                  type: text
                  label: Description
            methodology:
              type: list
              label: Methodology
              style: vertical
              collapsed: true
              fields:
                .title:
                  type: text
                  label: Step Title
                .body:
                  type: textarea
                  label: Step Body
                  rows: 2
            comparison.headers:
              type: array
              label: 'Comparison: Column Headers (2)'
            comparison.rows:
              type: list
              label: 'Comparison: Rows'
              style: vertical
              collapsed: true
              fields:
                .a:
                  type: text
                  label: Column A
                .b:
                  type: text
                  label: Column B
            comparison.note:
              type: textarea
              label: 'Comparison: Note'
              rows: 2
            key_metrics:
              type: array
              label: Key Metrics
            who_needs_this:
              type: list
              label: Who Needs This
              style: vertical
              collapsed: true
              fields:
                .title:
                  type: text
                  label: Title
                .body:
                  type: textarea
                  label: Body
                  rows: 2
            use_cases:
              type: array
              label: Use Cases
            expert_insight:
              type: textarea
              label: Expert Insight
              rows: 3
            faqs:
              type: list
              label: FAQs
              style: vertical
              collapsed: true
              fields:
                .q:
                  type: text
                  label: Question
                .a:
                  type: textarea
                  label: Answer
                  rows: 3
            cta.heading:
              type: text
              label: 'CTA: Heading'
            cta.body:
              type: textarea
              label: 'CTA: Body'
              rows: 2
            cta.button_label:
              type: text
              label: 'CTA: Button Label'
            cta.button_url:
              type: text
              label: 'CTA: Button URL'
            taxonomy.service:
              type: array
              label: 'Taxonomy: Service'
            metadata.description:
              type: textarea
              label: Meta Description
              rows: 2
            sitemap.changefreq:
              type: select
              label: 'Sitemap: Change Frequency'
              options:
                always: always
                hourly: hourly
                daily: daily
                weekly: weekly
                monthly: monthly
                yearly: yearly
                never: never
            sitemap.priority:
              type: number
              label: 'Sitemap: Priority'
              validate:
                min: 0
                max: 1
                step: 0.1
