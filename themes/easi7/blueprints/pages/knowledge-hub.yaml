title: Knowledge Hub Listing
extends@:
  type: default
context: blueprints://pages
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          fields:
            menu:
              type: text
              label: Menu Label
            summary:
              type: textarea
              label: Summary
              rows: 3
            guides:
              type: list
              label: Featured Guides
              style: vertical
              collapsed: true
              fields:
                .route:
                  type: text
                  label: Route
                .meta:
                  type: text
                  label: Meta Label
            metadata.description:
              type: textarea
              label: Meta Description
              rows: 2
            sitemap.changefreq:
              type: select
              label: 'Sitemap: Change Frequency'
              options:
                always: always
                hourly: hourly
                daily: daily
                weekly: weekly
                monthly: monthly
                yearly: yearly
                never: never
            sitemap.priority:
              type: number
              label: 'Sitemap: Priority'
              validate:
                min: 0
                max: 1
                step: 0.1
